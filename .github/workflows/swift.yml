# CI: SwiftPMビルド+テスト(カバレッジ付き)、xcodebuildビルド、SwiftLint
name: CI

# pull_request にブランチ制限を付けない: スタックPR (main以外がbase) でもCIを実行するため
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  spm-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode 16
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Build
        run: swift build -v
      - name: Run tests with coverage
        run: swift test --enable-code-coverage
      - name: Export coverage (lcov)
        run: |
          BIN=$(swift build --show-bin-path)
          xcrun llvm-cov export -format=lcov \
            "$BIN/MarkdownViewerPackageTests.xctest/Contents/MacOS/MarkdownViewerPackageTests" \
            -instr-profile "$BIN/codecov/default.profdata" \
            -ignore-filename-regex='(\.build|Tests)/' > coverage.lcov
          xcrun llvm-cov report \
            "$BIN/MarkdownViewerPackageTests.xctest/Contents/MacOS/MarkdownViewerPackageTests" \
            -instr-profile "$BIN/codecov/default.profdata" \
            -ignore-filename-regex='(\.build|Tests)/'
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.lcov

  # 配布経路(Makefile/xcodebuild)の検証。pbxprojが壊れてもswift buildでは検出できないため
  xcode-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode 16
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build with xcodebuild
        run: |
          xcodebuild build \
            -project MarkdownViewer.xcodeproj \
            -scheme MarkdownViewer \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging
